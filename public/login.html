<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 1socialChat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1E2A38">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-logo">
                <span class="logo-main">1socialChat</span>
                <span class="logo-tagline">Zero billionaires. 100% artist-owned.</span>
            </h1>
            <h2>Login</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>

                <div class="error-message" id="errorMessage"></div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <p class="auth-link">
                Don't have an account? <a href="/register.html">Register here</a>
            </p>

            <div class="about-toggle">
                <button class="about-toggle-btn" id="aboutToggleBtn">What is this site?</button>
                <div class="about-blurb" id="aboutBlurb">
                    <p>This is a self-hosted community running on <strong>socialChat</strong> — an open-source social network anyone can deploy for their own community. No ads, no algorithms, no billionaires. Just people.</p>
                    <a href="/about.html" class="about-read-more">Read more &rarr;</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/crypto.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('aboutToggleBtn').addEventListener('click', function() {
            document.getElementById('aboutBlurb').classList.toggle('open');
        });
    </script>
    <script src="/js/pwa.js"></script>
</body>
</html>
