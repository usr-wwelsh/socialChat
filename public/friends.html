<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - 1socialChat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Left Navigation Sidebar -->
    <aside class="nav-sidebar" id="navSidebar">
        <div class="nav-sidebar-logo">
            <a href="/" class="logo-main">1socialChat</a>
            <span class="logo-tagline">Zero billionaires. 100% artist-owned.</span>
        </div>
        <nav class="nav-sidebar-links">
            <a href="/" class="nav-link"><span class="nav-icon">🏠</span> <span class="nav-label">Home</span></a>
            <a href="#" id="viewProfile" class="nav-link"><span class="nav-icon">👤</span> <span class="nav-label">Profile</span></a>
            <a href="/friends.html" class="nav-link active"><span class="nav-icon">👥</span> <span class="nav-label">Friends</span></a>
            <a href="/moderation.html" id="moderationLink" class="nav-link" style="display:none;"><span class="nav-icon">🛡️</span> <span class="nav-label">Moderation</span></a>
        </nav>
        <div class="nav-sidebar-user">
            <span id="navUsername"></span>
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </div>
    </aside>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav" id="mobileNav">
        <a href="/" class="mobile-nav-item">🏠</a>
        <a href="#" class="mobile-nav-item" id="mobileProfile">👤</a>
        <a href="/friends.html" class="mobile-nav-item active">👥</a>
    </nav>

    <div class="main-container no-sidebar">
        <div class="friends-container">
            <h2>Friends</h2>

            <!-- Tab Navigation -->
            <div class="friends-tabs">
                <button class="tab-btn active" data-tab="friends">Friends</button>
                <button class="tab-btn" data-tab="requests">
                    Friend Requests <span id="requestCount" class="badge">0</span>
                </button>
                <button class="tab-btn" data-tab="sent">Sent Requests</button>
                <button class="tab-btn" data-tab="search">Find Friends</button>
            </div>

            <!-- Friends List Tab -->
            <div class="tab-content active" id="friendsTab">
                <div id="friendsList" class="friends-list">
                    <div class="loading">Loading friends...</div>
                </div>
            </div>

            <!-- Friend Requests Tab -->
            <div class="tab-content" id="requestsTab">
                <div id="friendRequests" class="friends-list">
                    <div class="loading">Loading requests...</div>
                </div>
            </div>

            <!-- Sent Requests Tab -->
            <div class="tab-content" id="sentTab">
                <div id="sentRequests" class="friends-list">
                    <div class="loading">Loading sent requests...</div>
                </div>
            </div>

            <!-- Search Friends Tab -->
            <div class="tab-content" id="searchTab">
                <div class="search-section">
                    <input type="text" id="searchInput" placeholder="Search for users..." class="search-input">
                    <button id="searchBtn" class="btn-primary">Search</button>
                </div>
                <div id="searchResults" class="friends-list">
                    <p class="hint">Enter a username to search for friends</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/friends.js"></script>
    <script src="/js/cookie-banner.js"></script>
</body>
</html>
