<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - 1socialChat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Left Navigation Sidebar -->
    <aside class="nav-sidebar" id="navSidebar">
        <div class="nav-sidebar-logo">
            <a href="/"><img src="/logo.gif" alt="1socialChat" class="logo-img"></a>
        </div>
        <nav class="nav-sidebar-links">
            <a href="/" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> <span class="nav-label">Home</span></a>
            <a href="#" id="viewProfile" class="nav-link active"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> <span class="nav-label">Profile</span></a>
            <a href="/friends.html" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> <span class="nav-label">Friends</span></a>
        </nav>
        <div class="nav-sidebar-user">
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </div>
    </aside>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav" id="mobileNav">
        <a href="/" class="mobile-nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
        <a href="#" class="mobile-nav-item active"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        <a href="/friends.html" class="mobile-nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></a>
    </nav>

    <div class="profile-container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar-container">
                <img id="profileAvatar" src="" alt="Profile Picture" class="profile-avatar">
                <button id="editProfileBtn" class="btn-edit" style="display: none;">Edit Profile</button>
            </div>
            <div class="profile-info">
                <h2 id="profileUsername"></h2>
                <p id="profileBio" class="profile-bio"></p>
                <div id="profileLinks" class="profile-links"></div>
                <p class="profile-joined">Joined: <span id="profileJoined"></span></p>
                <div id="friendshipActions" class="friendship-actions"></div>
            </div>
        </div>

        <!-- Friends Panel (Right on desktop, horizontal strip on mobile) -->
        <div class="friends-panel" id="friendsPanel">
            <h3 class="friends-panel-title">Top Friends</h3>
            <div id="friendsPanelList" class="friends-panel-list">
                <div class="loading">Loading friends...</div>
            </div>
        </div>

        <!-- Posts -->
        <div class="profile-posts">
            <h3>Posts</h3>
            <div id="profilePostsContainer" class="posts-container">
                <div class="loading">Loading posts...</div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal (outside grid) -->
    <div id="editProfileModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" id="closeEditModal">&times;</span>
            <h2>Edit Profile</h2>
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="editBio">Bio</label>
                    <textarea id="editBio" maxlength="500" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="editLinks">Links (JSON format)</label>
                    <textarea id="editLinks" rows="3" placeholder='{"website": "https://example.com", "twitter": "@username"}'></textarea>
                    <small>Format: {"label": "url", ...}</small>
                </div>
                <div class="form-group">
                    <label for="editProfilePicture">Profile Picture</label>
                    <input type="file" id="editProfilePicture" accept="image/*">
                    <small>Max 10MB</small>
                </div>
                <div class="error-message" id="editErrorMessage"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
            <div class="profile-data-section">
                <h3>Your Data</h3>
                <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">
                    Download everything we know about you (profile, posts, messages, etc.)
                </p>
                <button type="button" id="downloadDataBtn" class="btn-secondary" style="width: 100%;">
                    📊 Download My Data
                </button>
            </div>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div id="imageLightbox" class="image-lightbox">
        <button class="image-lightbox-close" id="closeLightbox">&times;</button>
        <button class="lb-nav lb-prev" id="lightboxPrev">&#8249;</button>
        <div class="image-lightbox-inner">
            <img id="lightboxImg" src="" alt="Image preview">
        </div>
        <button class="lb-nav lb-next" id="lightboxNext">&#8250;</button>
        <span class="lb-counter" id="lightboxCounter"></span>
    </div>

    <script src="/js/toast.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/cookie-banner.js"></script>
</body>
</html>
