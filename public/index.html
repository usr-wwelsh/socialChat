<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1socialChat - Zero billionaires. 100% artist-owned social network</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Join 1socialChat - a social network built by artists, for artists. Zero billionaires. 100% artist-owned. Share posts, connect with friends, and join live chatrooms.">
    <meta name="keywords" content="social network, artist community, independent social media, chatrooms, artist-owned platform">
    <meta name="author" content="1socialChat">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chat.wwel.sh/">
    <meta property="og:title" content="1socialChat - Zero billionaires. 100% artist-owned">
    <meta property="og:description" content="A social network built by artists, for artists. Share posts, connect with friends, and join live chatrooms.">
    <meta property="og:image" content="https://chat.wwel.sh/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://chat.wwel.sh/">
    <meta name="twitter:title" content="1socialChat - Zero billionaires. 100% artist-owned">
    <meta name="twitter:description" content="A social network built by artists, for artists. Share posts, connect with friends, and join live chatrooms.">
    <meta name="twitter:image" content="https://chat.wwel.sh/preview.png">

    <!-- Additional Meta Tags -->
    <link rel="canonical" href="https://chat.wwel.sh/">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#1E2A38">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Left Navigation Sidebar -->
    <aside class="nav-sidebar" id="navSidebar">
        <div class="nav-sidebar-logo">
            <img src="/logo.gif" alt="1socialChat" class="logo-img">
        </div>
        <nav class="nav-sidebar-links">
            <a href="/" class="nav-link active"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> <span class="nav-label">Home</span></a>
            <a href="#" id="viewProfile" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> <span class="nav-label">Profile</span></a>
            <a href="/friends.html" id="friendsLink" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> <span class="nav-label">Friends</span></a>
            <a href="#" id="chatNavLink" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> <span class="nav-label">Chat <span class="unread-badge" id="dmUnreadBadgeNav" style="display:none;">0</span></span></a>
            <a href="/moderation.html" id="moderationLink" class="nav-link" style="display:none;"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span> <span class="nav-label">Moderation</span></a>
        </nav>
        <div class="nav-sidebar-user">
            <span id="navUsername"></span>
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </div>
    </aside>

    <!-- Mobile Search Overlay -->
    <div class="mobile-search-overlay" id="mobileSearchOverlay">
        <div class="mobile-search-header">
            <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" id="mobileSearchInput" placeholder="Search — try # tags or @ people" class="global-search-input" autocomplete="off">
            <button class="mobile-search-close" id="mobileSearchClose">✕</button>
        </div>
        <div id="mobileSearchResults" class="search-results-dropdown" style="display:none;"></div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav" id="mobileNav">
        <a href="/" class="mobile-nav-item active"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
        <a href="#" class="mobile-nav-item" id="mobileSearch"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
        <a href="#" class="mobile-nav-item" id="mobileChatBtn"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
        <a href="#" class="mobile-nav-item" id="mobileProfile"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        <a href="/friends.html" class="mobile-nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></a>
    </nav>

    <div class="main-container">
        <div class="content-wrapper">
            <!-- Global Search Bar -->
            <div class="search-bar-container">
                <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                <input type="text" id="globalSearch" placeholder="Search — try # tags or @ people" class="global-search-input" autocomplete="off">
                <div id="searchResults" class="search-results-dropdown" style="display:none;"></div>
            </div>
            <!-- Create Post Section -->
            <div class="create-post-section">
                <div class="post-input-header">
                    <img id="userAvatar" src="" alt="Avatar" class="user-avatar">
                    <span id="createPostUsername"></span>
                </div>
                <textarea id="postContent" placeholder="Share your thoughts, upload media, or use #hashtags..." maxlength="5000"></textarea>

                <div class="quote-preview" id="quotePreview" style="display: none;"></div>

                <div class="post-media-preview" id="mediaPreview" style="display: none;">
                    <div id="mediaPreviewGrid" class="media-preview-grid" style="display: none;"></div>
                    <img id="mediaPreviewImg" src="" alt="Preview" style="display: none;">
                    <video id="mediaPreviewVideo" controls style="display: none;"></video>
                    <audio id="mediaPreviewAudio" controls style="display: none;"></audio>
                    <button class="btn-remove-media" id="removeMediaBtn">&#x2715; Clear</button>
                </div>

                <div class="post-actions">
                    <div class="post-buttons">
                        <label for="imageUpload" class="btn-icon" title="Upload up to 10 images">
                            <input type="file" id="imageUpload" accept="image/*" multiple style="display: none;">
                            📷 Image
                        </label>
                        <label for="videoUpload" class="btn-icon" title="Upload Video">
                            <input type="file" id="videoUpload" accept="video/*" style="display: none;">
                            🎥 Video
                        </label>
                        <label for="audioUpload" class="btn-icon" title="Upload Audio">
                            <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
                            🎵 Audio
                        </label>
                    </div>
                    <select id="postVisibility" class="visibility-selector" title="Post Visibility">
                        <option value="public">🌍 Public</option>
                        <option value="friends">👥 Friends</option>
                        <option value="private">🔒 Private</option>
                    </select>
                    <button id="createPostBtn" class="btn-primary">Post</button>
                </div>
            </div>

            <!-- Tag Filter Indicator -->
            <div id="activeFilter" class="active-filter" style="display: none;"></div>

            <!-- Posts Feed -->
            <div class="posts-container" id="postsContainer">
            </div>
        </div>

        <!-- Right Discovery Sidebar -->
        <aside class="discovery-sidebar">
            <h3 class="discovery-title">Discovery</h3>
            <div id="trendingPosters" class="trending-posters-widget"></div>
            <div id="trendingTags" class="trending-tags-widget"></div>
        </aside>

        <!-- Chatroom Section -->
        <div class="chat-section" id="chatSection">
            <div class="chat-header">
                <div class="chat-title">
                    <!-- Tab buttons -->
                    <div class="chat-tabs">
                        <button class="chat-tab active" id="roomsTab" onclick="switchChatTab('rooms')">Rooms</button>
                        <button class="chat-tab" id="dmsTab" onclick="switchChatTab('dms')">
                            DMs <span class="unread-badge" id="dmUnreadBadge" style="display:none;">0</span>
                        </button>
                    </div>
                    <div class="chat-controls">
                        <button class="btn-minimize" id="minimizeChatBtn" title="Close chat">✕</button>
                        <button class="mobile-chat-close" id="mobileChatClose">✕</button>
                    </div>
                </div>
                <!-- Rooms header -->
                <div id="roomsHeader">
                    <div class="chatroom-info-bar">
                        <h3 id="currentChatroomName">Chatroom</h3>
                        <span class="user-count" id="userCount">👤 0 online</span>
                    </div>
                    <div class="chatroom-selector">
                        <select id="chatroomSelect">
                            <option value="">Loading...</option>
                        </select>
                        <button class="btn-icon" id="createChatroomBtn">+</button>
                    </div>
                </div>
                <!-- DMs header -->
                <div id="dmsHeader" style="display:none;">
                    <div class="dm-active-header">
                        <img id="dmPartnerAvatar" class="dm-partner-avatar" src="" alt="" style="display:none;">
                        <div class="dm-partner-info">
                            <span id="currentDmPartnerName" class="dm-partner-name">Direct Messages</span>
                            <span class="dm-enc-label" id="dmEncLabel" style="display:none;">🔒 end-to-end encrypted</span>
                        </div>
                        <button class="dm-compose-btn" id="newDmBtn" title="New Message">+ New</button>
                    </div>
                    <div id="dmConversationList" class="dm-conversation-list"></div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="loading">Loading messages...</div>
            </div>

            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <span></span>
            </div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message..." maxlength="2000">
                <button id="sendMessageBtn" class="btn-primary">Send</button>
            </div>
        </div>

        <!-- New DM friend picker modal -->
        <div id="dmFriendPickerModal" class="modal" style="display:none;">
            <div class="modal-content dm-friend-picker">
                <h3>New Message</h3>
                <div id="dmFriendPickerList" class="dm-friend-list">
                    <div class="loading">Loading friends...</div>
                </div>
                <button class="btn-secondary" onclick="closeDmFriendPicker()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <!-- Image Lightbox -->
    <div id="imageLightbox" class="image-lightbox">
        <button class="image-lightbox-close" id="closeLightbox">&times;</button>
        <button class="lb-nav lb-prev" id="lightboxPrev">&#8249;</button>
        <div class="image-lightbox-inner">
            <img id="lightboxImg" src="" alt="Image preview">
        </div>
        <button class="lb-nav lb-next" id="lightboxNext">&#8250;</button>
        <span class="lb-counter" id="lightboxCounter"></span>
    </div>

    <script src="/js/toast.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/posts.js"></script>
    <script src="/js/crypto.js"></script>
    <script src="/js/dm.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/cookie-banner.js"></script>
    <script src="/js/pwa.js"></script>
</body>
</html>
