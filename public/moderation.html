<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderation Dashboard - 1SocialChat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/moderation.css">
</head>
<body>
    <!-- Left Navigation Sidebar -->
    <aside class="nav-sidebar" id="navSidebar">
        <div class="nav-sidebar-logo">
            <a href="/" class="logo-main">1socialChat</a>
            <span class="logo-tagline">Zero billionaires. 100% artist-owned.</span>
        </div>
        <nav class="nav-sidebar-links">
            <a href="/" class="nav-link"><span class="nav-icon">🏠</span> <span class="nav-label">Home</span></a>
            <a href="/profile.html" class="nav-link"><span class="nav-icon">👤</span> <span class="nav-label">Profile</span></a>
            <a href="/friends.html" class="nav-link"><span class="nav-icon">👥</span> <span class="nav-label">Friends</span></a>
            <a href="/moderation.html" class="nav-link active"><span class="nav-icon">🛡️</span> <span class="nav-label">Moderation</span></a>
        </nav>
        <div class="nav-sidebar-user">
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </aside>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav" id="mobileNav">
        <a href="/" class="mobile-nav-item">🏠</a>
        <a href="/profile.html" class="mobile-nav-item">👤</a>
        <a href="/friends.html" class="mobile-nav-item">👥</a>
        <a href="/moderation.html" class="mobile-nav-item active">🛡️</a>
    </nav>

    <div class="container moderation-container">
        <h1>🛡️ Moderation Dashboard</h1>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="pendingReportsCount">0</div>
                <div class="stat-label">Pending Reports</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="bannedUsersCount">0</div>
                <div class="stat-label">Banned Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalUsersCount">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="removedPostsCount">0</div>
                <div class="stat-label">Removed Posts</div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="reports">Reports</button>
            <button class="tab-btn" data-tab="users">Users</button>
            <button class="tab-btn" data-tab="bots">Bots</button>
        </div>

        <!-- Reports Tab -->
        <div id="reportsTab" class="tab-content active">
            <div class="filter-controls">
                <label>
                    Status:
                    <select id="reportStatusFilter">
                        <option value="pending">Pending</option>
                        <option value="reviewed">Reviewed</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </label>
                <button id="refreshReportsBtn" class="btn-secondary">Refresh</button>
            </div>

            <div id="reportsContainer" class="reports-list">
                <p class="loading-message">Loading reports...</p>
            </div>
        </div>

        <!-- Users Tab -->
        <div id="usersTab" class="tab-content">
            <div class="filter-controls">
                <button id="refreshUsersBtn" class="btn-secondary">Refresh</button>
            </div>

            <div id="usersContainer" class="users-list">
                <p class="loading-message">Loading users...</p>
            </div>
        </div>

        <!-- Bots Tab -->
        <div id="botsTab" class="tab-content">
            <div class="bot-controls">
                <h2>🤖 Bot Controls</h2>
                <div class="bot-trigger-panel">
                    <label for="botSelect">Select Bot</label>
                    <select id="botSelect">
                        <option value="">— random —</option>
                    </select>
                    <button id="triggerBotBtn" class="btn-primary">Generate Post</button>
                    <button id="burstBotBtn" class="btn-burst">Burst 10x (24h)</button>
                    <span id="botTriggerStatus" class="bot-trigger-status"></span>
                </div>
                <div class="bot-avatar-grid" id="botAvatarGrid"></div>
            </div>
        </div>

    </div>

    <script src="/js/moderation.js"></script>
</body>
</html>
